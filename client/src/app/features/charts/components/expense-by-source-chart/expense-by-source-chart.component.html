<mat-card class="chart-card">
  <mat-card-header>
    <mat-card-title>Expenses &amp; Income by Source</mat-card-title>
    <div class="header-actions">
      <button mat-icon-button (click)="export()" matTooltip="Export to Excel">
        <mat-icon>download</mat-icon>
      </button>
    </div>
  </mat-card-header>
  <mat-card-content class="chart-content">
    <div *ngIf="summary.totals_by_source.length === 0" class="empty-state">
      No source data available for this period.
    </div>
    <canvas *ngIf="summary.totals_by_source.length > 0"
      baseChart
      [type]="chartConfig.type"
      [data]="chartConfig.data"
      [options]="chartConfig.options">
    </canvas>
  </mat-card-content>
</mat-card>
