<app-generic-table
  [filter]="filterValue"
  [data]="rules"
  [columns]="columns"
  [isLoading]="isLoading"
  [errorMessage]="errorMessage"
  [showDeleteAction]="true"
  title="Source Rules"
  addButtonLabel="Add Rule"
  (edit)="editRule($event)"
  (add)="addRule()"
  (delete)="deleteRule($event)"
></app-generic-table>
